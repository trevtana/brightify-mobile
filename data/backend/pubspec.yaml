name: brightify_dart_backend
description: Native Dart backend for Brightify mobile app
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  # HTTP Server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5
  
  # MQTT Client
  mqtt_client: ^10.2.0
  
  # JSON & HTTP
